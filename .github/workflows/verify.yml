name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --dir web audit --prod --audit-level high
      # Secret scan over full history (baseline run 2026-09-26: clean; data/keys.json
      # has never been committed). Plain binary — the marketplace action needs a paid
      # license for org repos. Config: .gitleaks.toml. Needs fetch-depth: 0 above.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
  # Non-blocking e2e smoke (quality gate 3, in progress): boots its own dev
  # server against a throwaway data dir with ComfyUI/Ollama unreachable on
  # purpose. Not in the required `verify` job yet; failures don't block merges.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: web
      - run: ./node_modules/.bin/playwright test
        working-directory: web

name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --dir web audit --prod --audit-level high
      # Secret scan over full history (baseline run 2026-09-26: clean; data/keys.json
      # has never been committed). Plain binary — the marketplace action needs a paid
      # license for org repos. Config: .gitleaks.toml. Needs fetch-depth: 0 above.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .
  # Fast static analysis on every push/PR (TEST-BRIEF §19). CodeQL runs nightly
  # (codeql.yml) since code-scanning upload is GHAS-gated on private repos.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run semgrep scan --config p/typescript --config p/security-audit --error --exclude comfyui --exclude node_modules --exclude '*.test.ts' --exclude '*.test.tsx'
  # E2E (quality gate 3): boots its own dev server against a throwaway data dir
  # with ComfyUI/Ollama unreachable on purpose. BLOCKING since 2026-09-26 —
  # TEST-BRIEF §12; a red e2e is a red push.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: web
      - run: ./node_modules/.bin/playwright test
        working-directory: web

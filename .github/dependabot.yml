version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    # The gtk-rs/glib stack is pinned by tauri; independent bumps don't resolve.
    ignore:
      - dependency-name: "glib*"
      - dependency-name: "gio*"
      - dependency-name: "gobject*"
      - dependency-name: "gdk*"
      - dependency-name: "gtk*"
      - dependency-name: "cairo*"
      - dependency-name: "pango*"
      - dependency-name: "soup*"
      - dependency-name: "javascriptcore*"
      - dependency-name: "webkit2gtk*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
